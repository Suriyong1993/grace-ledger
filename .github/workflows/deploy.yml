name: Deploy Grace Ledger
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: supabase/setup-cli@v1
        with:
          version: 'latest'

      # Deploy Supabase Edge Functions (optional for Vercel preview)
      - run: npx supabase functions deploy auth-login --no-verify-jwt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v30
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-env: production
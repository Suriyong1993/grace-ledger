# ============================================================================
# Grace Ledger v2 — Production Docker Compose
# ============================================================================
# Usage:
#   1. Copy .env.example to .env and set strong secrets for ALL variables
#   2. docker compose up -d
#   3. Seed initial church:  curl -X POST http://localhost:3000/api/seed ...
#
# Portainer Stack: paste this entire file + set env vars in Portainer UI.
# All secrets MUST be provided via environment — no defaults exist in this file.

services:
  # ==========================================================================
  # PostgreSQL 16 — Primary database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: grace-ledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # PostgreSQL is NOT exposed to the host — app connects via internal network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - grace-ledger-net
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FSETID
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=64M
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "512M"
        reservations:
          cpus: "0.5"
          memory: "256M"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ==========================================================================
  # Grace Ledger Application
  # ==========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: grace-ledger:latest
    container_name: grace-ledger-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_URL: ${APP_URL:?APP_URL is required}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - grace-ledger-net
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128M,mode=1777
      - /tmp/app:size=64M,mode=0700,uid=1001,gid=1001
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "128M"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

# ============================================================================
# Volumes
# ============================================================================
volumes:
  pgdata:
    driver: local
    name: grace-ledger-pgdata

# ============================================================================
# Networks
# ============================================================================
networks:
  grace-ledger-net:
    driver: bridge
    name: grace-ledger-net

<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--background);display:flex;gap:12px;font-family:'Inter',sans-serif}
.sw{flex:1;height:80px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:11px;border:1px solid var(--border)}
</style></head><body>
<div class="sw" style="background:var(--background)">background<br>#FFFCF8</div>
<div class="sw" style="background:var(--card)">card<br>#ffffff</div>
<div class="sw" style="background:var(--secondary)">secondary<br>#fafaf9</div>
<div class="sw" style="background:var(--foreground);color:#fff;border:none">foreground<br>#171717</div>
<div class="sw" style="background:var(--muted-foreground);color:#fff;border:none">muted-fg<br>#737373</div>
</body></html>

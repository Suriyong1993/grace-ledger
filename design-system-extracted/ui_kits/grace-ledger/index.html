<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:var(--muted)}#root{min-height:820px}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="Login.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="Topbar.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="IncomeEntry.jsx"></script>
<script type="text/babel" src="Approvals.jsx"></script>
<script type="text/babel">
function App(){
  const [authed,setAuthed]=React.useState(false);
  const [screen,setScreen]=React.useState("dashboard");
  if(!authed) return <window.LoginScreen onLogin={()=>setAuthed(true)}/>;
  const Screen = { dashboard: window.DashboardScreen, income: window.IncomeEntryScreen, approvals: window.ApprovalsScreen }[screen] || window.DashboardScreen;
  return (
    <div style={{display:"flex",height:"820px",background:"var(--background)",fontFamily:"var(--font-sans)"}}>
      <window.Sidebar active={screen} onNavigate={setScreen}/>
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <window.Topbar user={{name:"คุณสมชาย",role:"ผู้ดูแลระบบ"}}/>
        <div style={{flex:1,overflowY:"auto"}}>
          <Screen onNavigate={setScreen}/>
        </div>
      </div>
    </div>
  );
}
window.addEventListener("DOMContentLoaded", () => {});
setTimeout(()=>{ ReactDOM.createRoot(document.getElementById("root")).render(<App/>); }, 0);
</script>
</body></html>

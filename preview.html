<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grace Ledger — Screen Preview (dev only)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/app.css">
  <style>
    /* Chrome for the harness itself — not part of the product surface. */
    .gl-preview-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
      padding: var(--space-2) var(--space-4);
      background: var(--sidebar);
      color: var(--sidebar-foreground);
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      border-bottom: 1px solid var(--sidebar-border);
    }
    .gl-preview-bar strong {
      font-family: var(--font-display);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: var(--text-2xs);
      margin-right: var(--space-2);
    }
    .gl-preview-bar button {
      font-family: inherit;
      font-size: var(--text-2xs);
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
      border: 1px solid color-mix(in srgb, var(--sidebar-foreground) 22%, transparent);
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    .gl-preview-bar button[aria-pressed="true"] {
      background: var(--sidebar-primary);
      border-color: var(--sidebar-primary);
      color: var(--sidebar-primary-foreground);
      font-weight: var(--weight-semibold);
    }
    .gl-preview-screens {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
    }
    .gl-preview-back {
      color: inherit;
      opacity: 0.7;
      text-decoration: none;
      font-size: var(--text-2xs);
      padding: var(--space-1) var(--space-2);
    }
    .gl-preview-back:hover { opacity: 1; text-decoration: underline; }
    .gl-preview-note {
      margin-left: auto;
      opacity: 0.6;
      font-size: var(--text-2xs);
    }
    /* Clears the fixed bar. Two lines' worth on narrow screens, where the
       buttons wrap. */
    #app { padding-top: 52px; }
    @media (max-width: 700px) { #app { padding-top: 84px; } }
  </style>
</head>
<body>
  <div class="gl-preview-bar" id="preview-bar">
    <strong>Preview</strong>
    <span id="preview-screens" class="gl-preview-screens"></span>
    <a class="gl-preview-back" href="/">← หน้าเข้าสู่ระบบ</a>
    <span class="gl-preview-note">ข้อมูลตัวอย่าง · ไม่ได้ต่อฐานข้อมูล</span>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/preview/previewMain.ts"></script>
</body>
</html>
